<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>加密项目调研评分</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-frame">
      <aside class="sidebar">
        <div class="brand">
          <strong>Crypto Research</strong>
          <span id="healthStatus">Local</span>
        </div>
        <nav>
          <button type="button" class="nav-item active" data-view="add">添加/更新项目信息</button>
          <button type="button" class="nav-item" data-view="dashboard">Dashboard</button>
        </nav>
      </aside>

      <section class="main-pane">
        <header class="topbar">
          <div>
            <h1>加密项目调研评分</h1>
            <p>输入 Token Symbol、项目名、X 链接和 RootData 链接，生成评分、TGE 判断和上线交易所跟踪。</p>
          </div>
        </header>

        <section class="view active" id="addView">
          <form class="input-bar" id="scoreForm">
            <label>
              <span>Token Symbol</span>
              <input name="token_ticker" placeholder="NEX" required />
            </label>
            <label>
              <span>项目名</span>
              <input name="project_name" placeholder="Nexus" required />
            </label>
            <label>
              <span>X 链接</span>
              <input name="x_handle" placeholder="https://x.com/NexusLabs" required />
            </label>
            <label>
              <span>RootData 链接</span>
              <input name="rootdata_url" placeholder="https://cn.rootdata.com/projects/detail/..." required />
            </label>
            <button type="submit" id="submitButton">开始更新评分</button>
          </form>

          <div id="reportMount"></div>
        </section>

        <section class="view" id="dashboardView">
          <div class="dashboard-header">
            <div>
              <h2>Dashboard</h2>
              <p>每个项目一行，点击 Token Symbol 打开评分页。</p>
            </div>
            <button type="button" id="refreshDashboard">刷新</button>
          </div>
          <div class="dashboard-table-wrap">
            <table class="dashboard-table">
              <thead>
                <tr>
                  <th>Token Symbol</th>
                  <th>项目名</th>
                  <th>基本面总分</th>
                  <th>基本面拆分</th>
                  <th>TGE 日期</th>
                  <th>上线交易所情况</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="dashboardRows">
                <tr><td colspan="7">暂无项目。</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <template id="reportTemplate">
      <section class="report-shell">
        <section class="report-hero">
          <div>
            <span class="eyebrow">评分输出</span>
            <h2 data-field="tokenTicker">--</h2>
            <p data-field="projectMeta">--</p>
            <button type="button" class="danger-button" data-action="deleteProject">删除项目</button>
          </div>
          <div class="total-score">
            <span class="total-score-ring" aria-hidden="true"></span>
            <strong data-field="totalScore">--</strong>
            <small>基本面总分 / 100</small>
          </div>
        </section>

        <section class="score-strip">
          <article>
            <span>团队分 <em>计入总分 25%</em></span>
            <strong data-field="teamScore">--</strong>
            <small data-field="teamReason">--</small>
          </article>
          <article>
            <span>融资分 <em>计入总分 20%</em></span>
            <strong data-field="fundingScore">--</strong>
            <small data-field="fundingReason">--</small>
          </article>
          <article>
            <span>投资方 <em>计入总分 15%</em></span>
            <strong data-field="investorScore">--</strong>
            <small data-field="investorReason">--</small>
          </article>
          <article>
            <span>社媒分 <em>计入总分 20%</em></span>
            <strong data-field="socialScore">--</strong>
            <small data-field="socialReason">--</small>
          </article>
          <article>
            <span>链生态 <em>计入总分 5%</em></span>
            <strong data-field="chainScore">--</strong>
            <small data-field="chainReason">--</small>
          </article>
          <article>
            <span>TGE前交易所 <em>计入总分 15%</em></span>
            <strong data-field="preTgeExchangeScore">--</strong>
            <small data-field="exchangeReason">--</small>
          </article>
        </section>

        <section class="report-grid">
          <article class="report-section">
            <div class="section-title">
              <h3>详细信息</h3>
              <span data-field="fetchStatus">--</span>
            </div>
            <ul data-field="evidenceList" class="clean-list"></ul>
          </article>

          <article class="report-section">
            <div class="section-title">
              <h3>TGE 情况</h3>
              <span data-field="tgeStatus">--</span>
            </div>
            <div class="tge-card">
              <strong data-field="tgeProbability">--</strong>
              <small data-field="tgeDate">--</small>
              <small data-field="tgeMethod">--</small>
            </div>
            <ul data-field="tgeEvidenceList" class="clean-list"></ul>
          </article>

          <article class="report-section wide">
            <div class="section-title">
              <h3>交易所上线情况</h3>
              <span>按时间排序</span>
            </div>
            <div data-field="roadmapList" class="timeline-list"></div>
          </article>
        </section>
      </section>
    </template>

    <script src="./app.js?v=20260602-investor-highlights"></script>
  </body>
</html>
